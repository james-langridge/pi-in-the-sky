name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1  # Shallow clone for speed
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache apt packages
      uses: actions/cache@v4
      id: apt-cache
      with:
        path: ~/apt-cache
        key: ${{ runner.os }}-apt-opencv
    
    - name: Install cached apt packages
      if: steps.apt-cache.outputs.cache-hit == 'true'
      run: |
        sudo cp -R ~/apt-cache/* /
    
    - name: Install system dependencies
      if: steps.apt-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-opencv
        mkdir -p ~/apt-cache
        sudo cp -R /usr/lib/python3/dist-packages/cv2* ~/apt-cache/ || true
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r server/requirements-test.txt
    
    - name: Run tests
      run: |
        cd server
        python run_tests.py
        python test_architecture.py

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1  # Shallow clone for speed
    
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      working-directory: ui
    
    - name: Build
      run: npm run build
      working-directory: ui
    
    - name: Check build output
      run: |
        if [ ! -d "ui/dist" ]; then
          echo "Build failed: dist directory not created"
          exit 1
        fi
        echo "Build successful: $(ls -la ui/dist | wc -l) files generated"

  lint-and-format:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('server/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort
    
    - name: Run Python linters
      run: |
        cd server
        ruff check . || true  # Non-blocking for now
        black --check . || true  # Non-blocking for now
        isort --check-only . || true  # Non-blocking for now