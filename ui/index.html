<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pi Camera Stream</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PiCam">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%234a90e2'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.35em' font-family='Arial' font-size='96' fill='white'%3E📷%3C/text%3E%3C/svg%3E">
    
    <!-- Theme color -->
    <meta name="theme-color" content="#4a90e2">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Main video container */
        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }

        #stream {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Controls toggle button */
        .toggle-controls {
            position: absolute;
            bottom: 20px;
            left: calc(50% - 20px); /* Half of the 40px width */
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            will-change: background; /* Optimize for background changes only */
        }

        .toggle-controls:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        .toggle-controls svg {
            width: 24px;
            height: 24px;
            pointer-events: none; /* Prevent SVG from interfering with hover */
        }

        /* Control panel */
        .controls {
            background: #f3f4f6;
            transition: max-height 0.3s ease, padding 0.3s ease;
            overflow: hidden;
            max-height: 0;
            padding: 0 20px;
        }

        .controls.open {
            max_height: 600px;
            padding: 20px;
            overflow-y: auto;
        }

        .controls-inner {
            max-width: 600px;
            margin: 0 auto;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        /* Control categories */
        .control-category {
            margin-bottom: 20px;
            background: white;
            border-radius: 8px;
            padding: 15px;
        }
        
        .category-header {
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .category-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .control-label {
            font-size: 13px;
            color: #374151;
            font-weight: 500;
        }
        
        /* Slider controls */
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #e5e7eb;
            border-radius: 3px;
            outline: none;
        }
        
        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .control-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            min-width: 50px;
            text-align: right;
            font-size: 13px;
            color: #6b7280;
        }
        
        /* Toggle controls */
        .control-toggle {
            width: 44px;
            height: 24px;
            -webkit-appearance: none;
            appearance: none;
            background: #e5e7eb;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .control-toggle:checked {
            background: #3b82f6;
        }
        
        .control-toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        
        .control-toggle:checked::after {
            transform: translateX(20px);
        }
        
        /* Select controls */
        .control-select {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-preset {
            background: #10b981;
            color: white;
        }

        .btn-preset:hover {
            background: #059669;
        }

        .btn-info {
            background: #3b82f6;
            color: white;
        }

        .btn-info:hover {
            background: #2563eb;
        }

        /* Status message */
        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .status.show {
            opacity: 1;
        }

        /* Error state */
        .error-message {
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        /* Loading indicator */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="loading" id="loading">Connecting to camera...</div>
        <img id="stream" alt="Camera stream" style="display: none;">
        <button class="toggle-controls" id="toggleBtn" onclick="toggleControls()">
            <svg id="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 15l-6-6-6 6"/>
            </svg>
        </button>
    </div>

    <div class="controls" id="controls">
        <div class="controls-inner">
            <div class="button-group">
                <button class="btn-preset" onclick="applyPreset('default')">Default</button>
                <button class="btn-preset" onclick="applyPreset('low_light')">Low Light</button>
                <button class="btn-preset" onclick="applyPreset('bright')">Bright</button>
                <button class="btn-info" onclick="resetControls()">Reset All</button>
            </div>
            <div id="controls-container">
                <!-- Controls will be dynamically loaded here -->
            </div>
        </div>
    </div>

    <div class="status" id="status"></div>

    <script type="module">
        import { CameraAPI } from './js/api.js';
        import { CameraControls } from './js/controls.js';
        
        // Configuration
        const BASE_URL = window.location.protocol === 'file:' 
            ? 'http://localhost:8080'
            : window.location.origin;

        // Initialize API and controls
        const api = new CameraAPI(BASE_URL);
        let cameraControls = null;
        
        // State
        let controlsOpen = false;

        // Initialize stream
        function initStream() {
            const stream = document.getElementById('stream');
            const loading = document.getElementById('loading');
            
            stream.src = api.getStreamUrl();
            
            stream.onload = () => {
                loading.style.display = 'none';
                stream.style.display = 'block';
            };
            
            stream.onerror = () => {
                loading.innerHTML = 'Failed to connect to camera stream';
            };
        }

        // Toggle controls panel
        window.toggleControls = function() {
            controlsOpen = !controlsOpen;
            const controls = document.getElementById('controls');
            const chevron = document.getElementById('chevron');
            
            if (controlsOpen) {
                controls.classList.add('open');
                chevron.innerHTML = '<path d="M6 9l6 6 6-6"/>';
            } else {
                controls.classList.remove('open');
                chevron.innerHTML = '<path d="M18 15l-6-6-6 6"/>';
            }
        }

        // Show status message
        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.background = isError ? 'rgba(239, 68, 68, 0.9)' : 'rgba(16, 185, 129, 0.9)';
            status.classList.add('show');
            
            setTimeout(() => {
                status.classList.remove('show');
            }, 3000);
        }

        // Apply camera preset
        window.applyPreset = async function(presetName) {
            try {
                const data = await api.applyPreset(presetName);
                
                if (data.status === 'success') {
                    showStatus(`Applied ${presetName} preset`);
                    // Reload controls to reflect new values
                    if (cameraControls) {
                        await cameraControls.loadControls();
                    }
                } else {
                    showStatus(data.message || 'Failed to apply preset', true);
                }
            } catch (error) {
                showStatus('Error applying preset', true);
                console.error('Error:', error);
            }
        }

        // Reset all controls to defaults
        window.resetControls = async function() {
            if (cameraControls) {
                await cameraControls.resetControls();
            }
        }

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', async () => {
            initStream();
            
            // Initialize camera controls
            cameraControls = new CameraControls(api, showStatus);
            await cameraControls.init();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && controlsOpen) {
                window.toggleControls();
            }
            if (e.key === ' ') {
                e.preventDefault();
                window.toggleControls();
            }
        });
    </script>
</body>
</html>
