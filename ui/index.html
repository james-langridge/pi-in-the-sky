<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pi Camera Stream</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PiCam">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%234a90e2'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.35em' font-family='Arial' font-size='96' fill='white'%3E📷%3C/text%3E%3C/svg%3E">

    <!-- Theme color -->
    <meta name="theme-color" content="#4a90e2">

    <!-- External CSS -->
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <!-- Version display -->
    <div class="version-display" id="version-display">
        <span id="version-text">v0.0.0</span>
        <button class="refresh-btn" id="refresh-btn" title="Refresh app">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            </svg>
        </button>
    </div>
    
    <!-- Update notification -->
    <div class="update-notification" id="update-notification" style="display: none;">
        <div class="update-content">
            <span class="update-text">A new version is available!</span>
            <button class="update-button" id="update-button">Refresh Now</button>
        </div>
    </div>
    
    <div class="video-container">
        <div class="loading" id="loading">
            <span id="loading-text">Connecting to camera...</span>
            <button id="manual-reconnect" class="btn-info" style="display: none; margin-top: 10px;">Retry Connection</button>
        </div>
        <img id="stream" alt="Camera stream" style="display: none;">
        <button class="toggle-controls" id="toggleBtn">
            <svg id="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 15l-6-6-6 6"/>
            </svg>
        </button>
    </div>

    <div class="controls" id="controls">
        <div class="controls-inner">
            <div class="button-group">
                <button class="btn-preset" id="preset-default">Default</button>
                <button class="btn-preset" id="preset-low-light">Low Light</button>
                <button class="btn-preset" id="preset-bright">Bright</button>
                <button class="btn-info" id="reset-all">Reset All</button>
            </div>

            <!-- Motion Detection Section -->
            <div class="control-category">
                <div class="category-header">Motion Detection</div>
                <div class="motion-status">
                    <span class="motion-indicator" id="motion-indicator"></span>
                    <span id="motion-status-text">Motion Detection: Off</span>
                    <button class="btn-info" id="toggle-motion" style="margin-left: auto; min-width: 100px;">Enable</button>
                </div>

                <!-- Motion Preset Selection -->
                <div class="category-controls">
                    <div class="control-item">
                        <label class="control-label">Detection Preset</label>
                        <select class="control-select" id="motion-preset">
                            <option value="sensitive">Sensitive - Indoor monitoring</option>
                            <option value="normal" selected>Normal - General use</option>
                            <option value="outdoor">Outdoor - Weather/trees</option>
                            <option value="security">Security - Night vision</option>
                        </select>
                    </div>
                </div>

                <div class="button-group" style="margin-top: 15px;">
                    <button class="btn-info" id="apply-motion-preset">Apply Preset</button>
                    <button class="btn-danger" id="test-notification">Test Notification</button>
                </div>
            </div>

            <div id="controls-container">
                <!-- Controls will be dynamically loaded here -->
            </div>
        </div>
    </div>

    <div class="status" id="status"></div>

    <!-- Main application JavaScript -->
    <script type="module" src="/app.js"></script>
    <!-- Prevent iOS from killing the app -->
    <script>
        // Keep-alive ping to prevent iOS suspension
        let keepAliveInterval;
        function startKeepAlive() {
            keepAliveInterval = setInterval(() => {
                if (!document.hidden) {
                    fetch('/health', { method: 'HEAD' }).catch(() => {});
                }
            }, 25000); // Ping every 25 seconds (before iOS 30s timeout)
        }

        function stopKeepAlive() {
            if (keepAliveInterval) {
                clearInterval(keepAliveInterval);
            }
        }

        // Manage based on visibility
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopKeepAlive();
            } else {
                startKeepAlive();
            }
        });

        // Start on load
        startKeepAlive();
    </script>
</body>
</html>
